name: PromptHall Monitor

on:
  schedule:
    # Uptime + page checks every 5 minutes (GitHub's minimum interval)
    - cron: "*/5 * * * *"
    # Weekly performance check + digest emails (Mondays 07:00 UTC)
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

# Never run two checks of the same kind at once; queue the next one instead.
concurrency:
  group: prompthall-monitor-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: false

jobs:
  uptime-check:
    runs-on: ubuntu-latest
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run uptime monitor
        run: node uptime-monitor.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}

  # Weekly full performance check runs separately on Monday mornings.
  # This keeps PageSpeed API calls to once a week per site (free tier: 25k/day,
  # but no need to burn it hourly when performance data changes slowly).
  weekly-performance:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 7 * * 1' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run weekly performance check
        run: node check-all-sites.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}

      - name: Send weekly digest emails
        run: node --dns-result-order=ipv4first send-digest.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
